<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupportOS - N1 Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; height: 100vh; overflow: hidden; display: flex; }

    /* SIDEBAR */
    .sidebar { width: 280px; background: #0f172a; color: white; display: flex; flex-direction: column; padding: 40px 24px; }
    .nav-item { padding: 14px 18px; border-radius: 14px; margin-bottom: 8px; cursor: pointer; transition: 0.3s; color: #94a3b8; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; }
    .nav-item.active { background: #3b82f6; color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

    /* CONTENIDO PRINCIPAL */
    .main-content { flex: 1; display: flex; flex-direction: column; background: white; border-radius: 32px 0 0 32px; box-shadow: -10px 0 50px rgba(0,0,0,0.05); }
    
    /* SELECTOR EQUIPO (TABS) */
    .selector { display: flex; gap: 40px; border-bottom: 1px solid #f1f5f9; padding: 0 40px; }
    .selector button { padding: 20px 0; font-weight: 800; font-size: 13px; color: #94a3b8; border-bottom: 3px solid transparent; transition: 0.3s; text-transform: uppercase; }
    .selector button.active { color: #3b82f6; border-bottom-color: #3b82f6; }

    /* PASOS (MENU) */
    .menu { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .menu button { padding: 10px 16px; border-radius: 12px; background: #f1f5f9; font-size: 11px; font-weight: 800; color: #64748b; transition: 0.2s; }
    .menu button.active { background: #00c896; color: white; }

    /* BLOQUE DE INFORMACIÓN */
    .block { background: #fff; border-radius: 20px; padding: 20px; border: 1px solid #e2e8f0; }
    h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; color: #0f172a; letter-spacing: -0.5px; }
    .item { font-size: 13px; margin-bottom: 4px; line-height: 1.4; color: #475569; }
    .tag { display: inline-block; font-size: 10px; font-weight: 800; background: #e0f2fe; color: #0369a1; padding: 4px 12px; border-radius: 99px; text-transform: uppercase; margin-bottom: 10px; }
    
    /* ALERTAS ESTILO SOPORTE */
    .nota-box { background: #fef9c3; border-left: 4px solid #facc15; padding: 10px; border-radius: 10px; font-size: 12px; color: #854d0e; margin-bottom: 8px; margin-top: 8px;}
    .alert-pago { background: #fef2f2; border-left: 4px solid #ef4444; color: #991b1b; padding: 12px; border-radius: 12px; font-weight: 700; margin-top: 10px; font-size: 12px;}
    .alert-falla { background: #fff7ed; border-left: 4px solid #f97316; color: #9a3412; padding: 12px; border-radius: 12px; font-weight: 700; margin-top: 10px; font-size: 12px;}
    .action { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 12px; border-radius: 12px; margin-top: 10px; font-size: 12px; font-weight: 600; color: #1e40af; }

    /* BOTONES */
    .btn { margin-top: 15px; width: 100%; padding: 12px; border-radius: 14px; background: #0f172a; color: white; font-weight: 800; font-size: 14px; transition: 0.3s; border: none; cursor: pointer; }
    .btn:hover { background: #1e293b; transform: translateY(-1px); }
    .btn-reset { background: transparent; color: #94a3b8; font-size: 11px; text-transform: uppercase; border: none; margin-top: 20px; font-weight: 800; cursor: pointer; width: 100%; }

    .ref-img { margin-top: 15px; border-radius: 20px; overflow: hidden; border: 1px solid #e2e8f0; }
    .ref-img img { width: 100%; height: auto; object-fit: cover; }
    .caption { font-size: 11px; padding: 10px; background: #f8fafc; color: #64748b; text-align: center; font-weight: 600; }
</style>
</head>

<body>

<aside class="sidebar">
    <div class="flex items-center gap-3 mb-12">
        <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center shadow-lg"><i class="fas fa-network-wired text-white"></i></div>
        <span class="text-xl font-extrabold tracking-tight">Support<span class="text-blue-400">OS</span></span>
    </div>
    
    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Procesos N1</p>
    <div class="nav-item active"><i class="fas fa-power-off"></i> Router Offline</div>
</aside>

<main class="main-content">
    <div class="selector" id="tabContainer"></div>

    <div class="flex-1 p-10 overflow-y-auto">
        <div id="contenido" class="max-w-2xl mx-auto">
            <div id="pillsMenu" class="menu"></div>
            <div id="appBlock"></div>
        </div>
    </div>
</main>

<script>
/* ============================================================
   BASE DE DATOS DE PROCESOS (CONTENIDO)
   Aquí agregas procesos nuevos sin tocar la lógica de abajo.
   ============================================================ */
const DATA_PROCESOS = {
    phantom: {
        label: "Phantom",
        steps: [
            { 
                short: "Validación", 
                title: "🔍 Router Offline", 
                tag: "Sistema",
                html: `<div class="item">Verifique servicio no suspendido o congelado</div>
                       <div class="alert-pago">🚫 Si está suspendido → enviar link de pago</div>
                       <div class="item">Revise si existe una falla masiva en la zona</div>
                       <div class="alert-falla">⚠️ Si hay falla → usar guion</div>
                       <button class="btn" style="background:#3b82f6" onclick="window.open('https://docs.google.com/presentation/d/1JMXrbALMvQ3tWBmwlh9zd4iF1o-o-m3ZlvtuyhR0UbM/edit?usp=sharing')">Abrir guion falla masiva</button>` 
            },
            { 
                short: "Principal", 
                title: "🖥 Router principal", 
                tag: "Herramienta",
                html: `<div class="item">Validar MAC asociada y Radius activo</div><div class="action">No activo → escalar backoffice</div>` 
            },
            { 
                short: "Secundario", 
                title: "🔀 Router secundario", 
                tag: "Red",
                html: `<div class="item">Confirmar IP distinta al principal</div>` 
            },
            { 
                short: "Usuario", 
                title: "🔌 Validación física", 
                tag: "Cliente",
                html: `<div class="item">Revisar energía. No chuzar equipo.</div>` 
            },
            { 
                short: "Resultado", 
                title: "✅ Resultado", 
                tag: "Final",
                html: `<div class="nota-box">Escalar a N2 si persiste el problema.</div>` 
            }
        ]
    },
    vilo: {
        label: "Router Vilo",
        steps: [
            { 
                short: "Validación", 
                title: "🔍 Router Offline", 
                tag: "Sistema",
                html: `<div class="item">Verifique servicio no suspendido</div>` 
            },
            { 
                short: "Física", 
                title: "🔌 Validación de conexiones", 
                tag: "Cliente",
                html: `<div class="nota-box"><b>Naranja:</b> Configurar en ISP.</div>
                       <div class="nota-box"><b>WAN:</b> Cable en puerto correcto.</div>` 
            },
            { 
                short: "Resultado", 
                title: "✅ Resultado", 
                tag: "Resultado",
                html: `<div class="nota-box">Validar energía y escalar a N2.</div>` 
            }
        ]
    }
};

/* ============================================================
   MOTOR DEL SISTEMA (LÓGICA BLINDADA)
   No necesitas tocar nada aquí para agregar contenido.
   ============================================================ */
let currentRouter = 'phantom';
let currentStep = 0;

function init() {
    const tabContainer = document.getElementById('tabContainer');
    tabContainer.innerHTML = '';
    
    // Crear botones de pestañas (Tabs)
    Object.keys(DATA_PROCESOS).forEach(key => {
        const btn = document.createElement('button');
        btn.id = 'tab-' + key;
        btn.innerText = DATA_PROCESOS[key].label;
        btn.onclick = () => switchRouter(key);
        tabContainer.appendChild(btn);
    });
    
    switchRouter('phantom');
}

function switchRouter(key) {
    currentRouter = key;
    currentStep = 0;
    
    // Actualizar estilo visual de las pestañas
    document.querySelectorAll('.selector button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + key).classList.add('active');
    
    render();
}

function render() {
    const process = DATA_PROCESOS[currentRouter];
    const stepData = process.steps[currentStep];
    
    // 1. Renderizar Menú de Pasos (Pills)
    const pillsMenu = document.getElementById('pillsMenu');
    pillsMenu.innerHTML = '';
    process.steps.forEach((step, index) => {
        const pill = document.createElement('button');
        pill.innerText = step.short;
        pill.className = index === currentStep ? 'active' : '';
        pill.onclick = () => { currentStep = index; render(); };
        pillsMenu.appendChild(pill);
    });
    
    // 2. Renderizar Bloque de Contenido
    document.getElementById('appBlock').innerHTML = `
        <div class="block">
            <div class="tag">${stepData.tag}</div>
            <h3>${stepData.title}</h3>
            ${stepData.html}
            
            ${currentStep < process.steps.length - 1 
                ? `<button class="btn" onclick="nextStep()">Continuar Paso <i class="fas fa-arrow-right ml-2"></i></button>` 
                : ''
            }
            
            <button class="btn-reset" onclick="switchRouter('${currentRouter}')">
                <i class="fas fa-redo-alt mr-2"></i> Reiniciar Proceso
            </button>
        </div>`;
}

function nextStep() {
    currentStep++;
    render();
}

// Iniciar al cargar la página
window.onload = init;
</script>
</body>
</html>
