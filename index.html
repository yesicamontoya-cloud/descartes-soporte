<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Hub - Estandarización</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .step-active { background: #00C896 !important; color: white !important; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .card-pro { border-radius: 20px; transition: all 0.3s ease; border: 1px solid #e5e7eb; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <header class="glass sticky top-0 z-50 border-b border-slate-200 p-4 mb-6 shadow-sm">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="font-bold text-xl flex items-center gap-2">
                <i class="fas fa-network-wired text-emerald-500"></i> SOPORTE HUB
            </h1>
            <span class="text-[10px] bg-slate-900 text-white px-2 py-1 rounded-full uppercase tracking-widest">N1 / N2</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-24">
        
        <div class="flex gap-2 mb-6">
            <button onclick="changeFlow('phantom')" id="tab-phantom" class="flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow-sm border-2 border-transparent transition-all">Phantom</button>
            <button onclick="changeFlow('vilo')" id="tab-vilo" class="flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow-sm border-2 border-transparent transition-all">Vilo</button>
        </div>

        <div id="step-menu" class="flex gap-1 mb-6 overflow-x-auto pb-2">
            </div>

        <div id="step-container" class="card-pro bg-white p-6 shadow-xl relative overflow-hidden">
            <div id="content-area">
                </div>
        </div>

    </main>

    <footer class="fixed bottom-0 left-0 right-0 p-4 glass border-t border-slate-200">
        <div class="max-w-md mx-auto flex gap-3">
            <button onclick="reset()" class="bg-slate-200 p-4 rounded-xl text-slate-600 hover:bg-slate-300 transition">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button onclick="nextStep()" id="btn-main" class="flex-1 bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-200 hover:bg-emerald-600 transition">
                CONTINUAR <i class="fas fa-chevron-right ml-2"></i>
            </button>
        </div>
    </footer>

    <script>
        // BASE DE DATOS DE PROCESOS (Aquí puedes añadir más fácil)
        const database = {
            phantom: {
                name: "Phantom",
                steps: [
                    { title: "Validación", tag: "SISTEMA", content: "Verifique estado en Radius y falta de pago. <div class='mt-4 p-3 bg-red-50 text-red-700 rounded-lg text-xs font-bold border-l-4 border-red-500'>🚫 Suspención → Enviar link de pago.</div>", tip: "No escale si el cliente debe facturas." },
                    { title: "Radius", tag: "BACKOFFICE", content: "Validar MAC y que tome IP. Si no toma IP, revisar aprovisionamiento.", tip: "Si no carga IP en Radius → Escalar a N2." },
                    { title: "Física", tag: "CLIENTE", content: "Revisar cables en puerto WAN y reiniciar equipo (30 seg).", tip: "Evidencia: Solicitar foto de LEDs." },
                    { title: "Resultado", tag: "FINAL", content: "Si persiste el error, genere el reporte para N2.", isFinal: true }
                ]
            },
            vilo: {
                name: "Router Vilo",
                steps: [
                    { title: "Validación", tag: "SISTEMA", content: "Verificar mora y fallas masivas en la zona.", tip: "Página 4 del guion de fallas." },
                    { title: "LED Vilo", tag: "FÍSICO", content: "<b>Naranja:</b> Configurar en Inventory.<br><b>Rojo:</b> Revisar WAN.", tip: "Blanco/Azul significa OK." },
                    { title: "Resultado", tag: "FINAL", content: "Validación Vilo completada.", isFinal: true }
                ]
            }
        };

        let currentFlow = 'phantom';
        let currentIdx = 0;

        function changeFlow(key) {
            currentFlow = key;
            currentIdx = 0;
            // Estilos de pestañas
            document.getElementById('tab-phantom').className = key === 'phantom' ? 'flex-1 py-3 rounded-xl font-bold text-sm bg-slate-900 text-white shadow-lg shadow-slate-300 border-2 border-slate-900' : 'flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow-sm';
            document.getElementById('tab-vilo').className = key === 'vilo' ? 'flex-1 py-3 rounded-xl font-bold text-sm bg-slate-900 text-white shadow-lg shadow-slate-300 border-2 border-slate-900' : 'flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow-sm';
            
            buildMenu();
            render();
        }

        function buildMenu() {
            const menu = document.getElementById('step-menu');
            menu.innerHTML = database[currentFlow].steps.map((s, i) => `
                <button onclick="goTo(${i})" class="flex-1 py-2 px-1 rounded-lg text-[10px] font-bold transition-all ${i === currentIdx ? 'step-active' : 'bg-white text-slate-400 border border-slate-200'}">
                    ${s.title}
                </button>
            `).join('');
        }

        function render() {
            const step = database[currentFlow].steps[currentIdx];
            const content = document.getElementById('content-area');
            
            content.innerHTML = `
                <span class="text-[10px] font-black bg-blue-100 text-blue-600 px-2 py-1 rounded-md tracking-tighter uppercase">${step.tag}</span>
                <h2 class="text-xl font-bold mt-3 mb-4 text-slate-800">${step.title}</h2>
                <div class="text-slate-600 text-sm leading-relaxed mb-6">${step.content}</div>
                <div class="bg-amber-50 p-4 rounded-xl border border-amber-100 flex gap-3">
                    <i class="fas fa-lightbulb text-amber-500 mt-1"></i>
                    <p class="text-xs text-amber-800 italic">${step.tip || 'Siga las instrucciones al pie de la letra.'}</p>
                </div>
            `;

            const btn = document.getElementById('btn-main');
            if(step.isFinal) {
                btn.innerHTML = `<i class="fas fa-copy mr-2"></i> COPIAR REPORTE N2`;
                btn.classList.replace('bg-emerald-500', 'bg-blue-600');
            } else {
                btn.innerHTML = `CONTINUAR <i class="fas fa-chevron-right ml-2"></i>`;
                btn.classList.replace('bg-blue-600', 'bg-emerald-500');
            }
            buildMenu();
        }

        function nextStep() {
            if (database[currentFlow].steps[currentIdx].isFinal) {
                copyReport();
            } else {
                currentIdx++;
                render();
            }
        }

        function goTo(i) { currentIdx = i; render(); }
        function reset() { currentIdx = 0; render(); }

        function copyReport() {
            const report = `REPORTE TÉCNICO - ${database[currentFlow].name}\nValidaciones completas.\nEstado: Pendiente N2\nResponsable: Soporte Hub`;
            navigator.clipboard.writeText(report);
            alert("Reporte copiado al portapapeles");
        }

        // Iniciar
        changeFlow('phantom');
    </script>
</body>
</html>
