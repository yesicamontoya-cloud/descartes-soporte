<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupportOS - Editor Mode</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; display: flex; height: 100vh; overflow: hidden; }
    
    /* SIDEBAR OSCURA */
    .sidebar { width: 260px; background: #0f172a; color: white; display: flex; flex-direction: column; padding: 30px 20px; }
    
    /* CONTENEDOR BLANCO */
    .main-app { flex: 1; display: flex; flex-direction: column; background: white; border-radius: 30px 0 0 30px; box-shadow: -10px 0 30px rgba(0,0,0,0.05); }
    
    /* BOTONES DE EQUIPO (TABS) */
    .tab-container { display: flex; gap: 10px; padding: 20px 40px; background: #f8fafc; border-radius: 30px 0 0 0; }
    .btn-tab { flex: 1; padding: 15px; border-radius: 15px; font-weight: 800; transition: 0.3s; font-size: 16px; }
    .btn-tab.active { background: #0f172a; color: white; }
    .btn-tab.inactive { background: white; color: #0f172a; border: 1px solid #e2e8f0; }

    /* BOTONES DE PASOS (TEXTO) */
    .step-list { display: flex; gap: 10px; padding: 10px 40px; flex-wrap: wrap; }
    .btn-step { padding: 8px 20px; border-radius: 12px; background: #f1f5f9; color: #64748b; font-weight: 700; font-size: 13px; }
    .btn-step.active { background: #00c896; color: white; }

    /* CAJAS DE DISEÑO PARA TU INFO */
    .card-info { margin: 20px 40px; padding: 30px; border-radius: 20px; border: 1px solid #e2e8f0; flex: 1; overflow-y: auto; }
    .badge { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 10px; text-transform: uppercase; }
    
    /* CLASES PARA QUE USES EN TU EDICIÓN */
    .alerta-roja { background: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; padding: 15px; border-radius: 15px; text-align: center; font-weight: 700; margin: 15px 0; }
    .caja-validacion { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 15px; padding: 20px; }
    .caja-validacion h4 { color: #64748b; font-weight: 800; font-size: 12px; text-align: center; margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .caja-validacion ul { list-style: none; padding: 0; color: #475569; font-size: 14px; }
    .caja-validacion li { margin-bottom: 8px; }
    .caja-validacion li::before { content: "•"; color: #3b82f6; font-weight: bold; margin-right: 8px; }
</style>
</head>
<body>

<aside class="sidebar">
    <div class="flex items-center gap-3 mb-10">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg"><i class="fas fa-tools text-white"></i></div>
        <span class="text-xl font-extrabold">SupportOS</span>
    </div>
    <div class="p-3 bg-blue-500 rounded-xl font-bold text-sm"><i class="fas fa-wifi mr-2"></i> Router Offline</div>
</aside>

<main class="main-app">
    <div class="tab-container">
        <button id="tab1" class="btn-tab active" onclick="cambiarEquipo('phantom')">Phantom</button>
        <button id="tab2" class="btn-tab inactive" onclick="cambiarEquipo('vilo')">Router Vilo</button>
    </div>

    <div id="contenedorPasos" class="step-list"></div>

    <div class="card-info">
        <div id="espacioInfo"></div>
        <button class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold mt-6 shadow-lg" onclick="siguiente()">Siguiente Paso <i class="fas fa-chevron-right ml-2"></i></button>
    </div>
</main>

<script>
/* ============================================================
   /* === PANEL DE EDICIÓN: AQUÍ PONES TU PROPIA INFO === */
   /* ============================================================ */
const MI_PROCESO = {
    phantom: [
        { 
            boton: "Validación", 
            etiqueta: "PASO 1", 
            titulo: "Validación de Cuenta", 
            html: `
                <p class="text-slate-600 mb-4">Verifique el estado del servicio en el sistema.</p>
                <div class="alerta-roja" style="background:#fff7ed; color:#9a3412; border-color:#fed7aa">⚠️ REVISAR FALLA MASIVA</div>
            `
        },
        { 
            boton: "Principal", 
            etiqueta: "HERRAMIENTA", 
            titulo: "Router Principal", 
            html: `<p class="text-slate-600">Validar MAC y Radius.</p>`
        },
        { 
            boton: "Resultado", 
            etiqueta: "FINAL", 
            titulo: "Resultado", 
            html: `
                <div class="alerta-roja"><i class="fas fa-times mr-2"></i> No funciona</div>
                <div class="caja-validacion">
                    <h4>ANTES DE ESCALAR VALIDAR:</h4>
                    <ul>
                        <li>Router principal validado</li>
                        <li>Router secundario validado</li>
                        <li>Conexiones correctas</li>
                        <li>Energía / luz del router OK</li>
                    </ul>
                </div>
            `
        }
    ],
    vilo: [
        { 
            boton: "Validación", 
            etiqueta: "VILO", 
            titulo: "Router Vilo", 
            html: `<p>Pegue aquí su información de Vilo...</p>`
        }
    ]
};

/* ============================================================
   LÓGICA DEL SISTEMA (YA NO NECESITAS TOCAR ESTO)
   ============================================================ */
let eqActual = 'phantom';
let pasoIdx = 0;

function cambiarEquipo(e) {
    eqActual = e; pasoIdx = 0;
    document.getElementById('tab1').className = e === 'phantom' ? 'btn-tab active' : 'btn-tab inactive';
    document.getElementById('tab2').className = e === 'vilo' ? 'btn-tab active' : 'btn-tab inactive';
    dibujar();
}

function dibujar() {
    const lista = MI_PROCESO[eqActual];
    const data = lista[pasoIdx];
    
    // Botones superiores (Puntos de navegación)
    document.getElementById('contenedorPasos').innerHTML = lista.map((p, i) => `
        <button class="btn-step ${i === pasoIdx ? 'active' : ''}" onclick="irA(${i})">${p.boton}</button>
    `).join('');

    // Contenido central
    document.getElementById('espacioInfo').innerHTML = `
        <span class="badge">${data.etiqueta}</span>
        <h2 class="text-3xl font-extrabold text-slate-900 mt-2 mb-6">${data.titulo}</h2>
        <div>${data.html}</div>
    `;
}

function siguiente() { if(pasoIdx < MI_PROCESO[eqActual].length - 1) { pasoIdx++; dibujar(); } }
function irA(i) { pasoIdx = i; dibujar(); }

dibujar(); // Iniciar app
</script>
</body>
</html>
