<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soporte Hub - N1 Full</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:'Segoe UI',Tahoma,sans-serif;
    background:#d9d9d9;
    padding:14px;
    color:#111827;
  }

  .frame{
    max-width:520px;
    margin:auto;
    background:#f3f4f6;
    border:2px solid #3b82f6;
    padding:18px 16px 14px;
    border-radius: 8px;
  }

  /* Selectores de Proceso Superior */
  .process-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
  }
  .btn-proc {
    flex: 1;
    padding: 12px 8px;
    border: none;
    border-radius: 10px;
    background: #fff;
    font-weight: 800;
    cursor: pointer;
    border: 2px solid #d1d5db;
    font-size: 11px;
    text-transform: uppercase;
    transition: 0.2s;
  }
  .btn-proc.active {
    background: #0f172a;
    color: white;
    border-color: #0f172a;
  }

  .panel{
    background:#ffffff;
    border-radius:12px;
    padding:14px;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
  }

  .top-tabs {
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }

  .top-tab {
    flex:1;
    border:none;
    border-radius:10px;
    padding:10px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    background:#e5e7eb;
    transition:.2s;
  }

  .top-tab.active {
    background:#3b82f6;
    color:#fff;
  }

  .step-row {
    display:flex;
    gap:6px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }

  .step-chip {
    flex:1;
    min-width: 90px;
    border:none;
    border-radius:8px;
    padding:8px 4px;
    font-size:10px;
    font-weight:700;
    cursor:pointer;
    background:#e5e7eb;
  }

  .step-chip.active {
    background:#14c79a;
    color:#fff;
  }

  .card {
    background:#fff;
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:18px 16px 14px;
  }

  .card-title {
    font-size:16px;
    font-weight:800;
    margin:0 0 12px;
  }

  .tag {
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:#4f46e5;
    background:#f5f3ff;
    padding:4px 8px;
    border-radius:999px;
    margin-bottom:12px;
  }

  /* Estilos de contenido heredados */
  .item { font-size:14px; line-height:1.45; margin-bottom:10px; }
  .nota-box { background:#FEF9C3; border-left:4px solid #FACC15; color:#854D0E; padding:10px; border-radius:8px; font-size:12px; margin-bottom:10px; }
  .alert-pago { background:#FEF2F2; border-left:4px solid #DC2626; color:#7F1D1D; padding:10px; border-radius:8px; font-weight:600; font-size: 13px; margin-bottom:10px; }
  .alert-falla { background:#FFF7ED; border-left:4px solid #F97316; color:#9A3412; padding:10px; border-radius:8px; font-weight:600; font-size: 13px; margin-bottom:10px; }

  .btn { width:100%; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:800; cursor:pointer; margin-top:8px; }
  .btn-primary { background:#14c79a; color:#fff; }
  .btn-secondary { background:#fff; color:#444; border:1px solid #d1d5db; }
  .btn-danger { background:#ef4444; color:#fff; }
</style>
</head>
<body>
  <div class="frame">
    <div class="page-title">SOPORTE HUB N1</div>

    <div class="process-selector">
      <button id="procOffline" class="btn-proc active" onclick="switchProceso('offline')">Router Offline</button>
      <button id="procSlow" class="btn-proc" onclick="switchProceso('slow')">Baja Velocidad</button>
    </div>

    <div class="panel">
      <div class="top-tabs">
        <button id="tabPhantom" class="top-tab active" onclick="switchEquipo('phantom')">Phantom</button>
        <button id="tabVilo" class="top-tab" onclick="switchEquipo('vilo')">Router Vilo</button>
      </div>

      <div id="stepRow" class="step-row"></div>

      <div class="card">
        <h3 id="cardTitle" class="card-title">Cargando...</h3>
        <div id="contenido"></div>
      </div>
    </div>
  </div>

<script>
  let procesoActual = 'offline';
  let equipoActual = 'phantom';
  let currentIndex = 0;

  const data = {
    offline: {
      phantom: [
        { title: 'Validación', tag: 'Sistema', html: `
            <div class="item">Verifique que el servicio no esté suspendido por falta de pago o congelado.</div>
            <div class="alert-pago">🚫 Si está suspendido → enviar link de pago</div>
            <div class="item">Revise si existe una falla masiva en la zona.</div>
            <div class="alert-falla">⚠️ Si hay falla → usar guion</div>
            <button class="btn btn-primary" onclick="nextStep()">Continuar</button>` 
        },
        { title: 'Principal', tag: 'Herramienta', html: `
            <div class="item">Validar que la MAC esté asociada y autenticada en Radius (estado activo).</div>
            <div class="nota-box">Si no está activo → escalar backoffice</div>
            <div class="item">Verificar que el router tome IP.</div>
            <div class="nota-box" style="border-left-color: #3b82f6;"><b>Si no toma IP → escalar a N2</b></div>
            <button class="btn btn-primary" onclick="nextStep()">Continuar</button>` 
        },
        { title: 'Secundario', tag: 'Red', html: `
            <div class="item">Confirmar que no tenga la misma IP que el principal.</div>
            <div class="item">Validar en Grafana que no esté en NA.</div>
            <div class="item">Verificar que el puerto LAN registre 1G o 2G.</div>
            <div class="nota-box">Nota: No aplica para domótica.</div>
            <button class="btn btn-primary" onclick="nextStep()">Continuar</button>` 
        },
        { title: 'Físico', tag: 'Cliente', html: `
            <div class="item">Revisar conexiones físicas y energía.</div>
            <div class="item">Confirmar que no haya cables en el puerto WAN.</div>
            <div class="item">Reiniciar el equipo (30 segundos desconectado).</div>
            <div class="alert-pago" style="background:#FFF1F2; border-color:#E11D48; color:#9F1239">⚠️ No chuzar el equipo (Phantom)</div>
            <button class="btn btn-primary" onclick="nextStep()">Continuar</button>` 
        },
        { title: 'Resultado', tag: 'Final', html: `
            <div class="item" style="text-align:center; font-weight:800;">¿El servicio funciona?</div>
            <button class="btn btn-primary" onclick="resetFlow()">✅ Funciona (Cerrar)</button>
            <button class="btn btn-danger" onclick="nextStep()">❌ No funciona (Escalar)</button>` 
        },
        { title: 'Reporte', tag: 'N2', html: `
            <div class="nota-box"><b>ESCALAMIENTO N2:</b><br>✔ Router principal validado<br>✔ Router secundario validado<br>✔ Conexiones correctas</div>
            <button class="btn btn-secondary" onclick="resetFlow()">Reiniciar flujo</button>` 
        }
      ],
      vilo: [
        { title: 'Validación', tag: 'Sistema', html: `
            <div class="item">Verifique pago y falla masiva.</div>
            <div class="alert-pago">🚫 Si está suspendido → enviar link</div>
            <button class="btn btn-primary" onclick="nextStep()">Continuar</button>` 
        },
        { title: 'Principal', tag: 'Radius', html: `<div class="item">Validar MAC y que tome IP en Radius.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Físico', tag: 'LED Vilo', html: `
            <div class="nota-box"><b style="color:#D97706">NARANJA</b><br>Configurar ISP Inventory. Si no sube: Chuzar equipo.</div>
            <div class="nota-box" style="background:#FEF2F2; border-left-color: #EF4444"><b style="color:#EF4444">ROJO</b><br>Validar cables. Desconectar y conectar cable de red. Reiniciar.</div>
            <div class="item"><b>WAN:</b> Principal (Cable en WAN), Secundario (NO cable en WAN).</div>
            <button class="btn btn-primary" onclick="nextStep()">Continuar</button>` 
        },
        { title: 'Resultado', tag: 'Final', html: `
            <div class="item" style="text-align:center; font-weight:800;">¿El servicio funciona?</div>
            <button class="btn btn-primary" onclick="resetFlow()">✅ Funciona (Cerrar)</button>
            <button class="btn btn-danger" onclick="nextStep()">❌ No funciona (Escalar)</button>` 
        },
        { title: 'Reporte', tag: 'N2', html: `<div class="nota-box">✔ Color LED validado<br>✔ Configuración Inventory aplicada</div><button class="btn btn-secondary" onclick="resetFlow()">Reiniciar</button>` }
      ]
    },
    slow: {
      phantom: [
        { title: 'Validación', tag: 'Entorno', html: `<div class="item">Revisar que no haya falla masiva y validar plan contratado.</div><div class="nota-box">Confirmar que los dos routers no tengan conflicto de IP.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Velocidad', tag: 'Sistema', html: `<div class="item">Verificar negociación del puerto LAN en Grafana.</div><div class="nota-box">Debe estar a 1000M. Si está a 100M, el problema es el cable del cliente.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'WiFi 5G', tag: 'Pruebas', html: `<div class="item">Prueba en red 5G con servidor SOMOS (Ookla).</div><div class="item">Desactivar VPNs y validar en otro dispositivo.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Optimizar', tag: 'Soporte', html: `<div class="item">Solicitar cambio de canales por el grupo de soporte.</div><div class="nota-box">Sugerir separar redes 2.4 y 5 si hay saturación.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Resultado', tag: 'Final', html: `<button class="btn btn-primary" onclick="resetFlow()">✅ Velocidad OK</button><button class="btn btn-danger" onclick="nextStep()">❌ Sigue lento</button>` },
        { title: 'Escalar', tag: 'N2', html: `<div class="nota-box">✔ Test cable realizado<br>✔ Canales cambiados</div><button class="btn btn-secondary" onclick="resetFlow()">Reiniciar</button>` }
      ],
      vilo: [
        { title: 'Validación', tag: 'General', html: `<div class="item">Revisar falla masiva y plan contratado.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Malla', tag: 'Mesh', html: `<div class="item">Validar distancia entre nodos (máximo 2 paredes).</div><div class="nota-box">Revisar estados en la App Vilo o Inventory.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'WiFi', tag: 'Ajustes', html: `<div class="item">Ancho de banda a 80MHz y canales automáticos.</div><div class="item">Verificar versión de Firmware.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Resultado', tag: 'Final', html: `<button class="btn btn-primary" onclick="resetFlow()">✅ Velocidad OK</button><button class="btn btn-danger" onclick="nextStep()">❌ Sigue lento</button>` },
        { title: 'Escalar', tag: 'N2', html: `<div class="nota-box">✔ Malla validada<br>✔ Firmware al día</div><button class="btn btn-secondary" onclick="resetFlow()">Reiniciar</button>` }
      ]
    }
  };

  function switchProceso(proc) {
    procesoActual = proc;
    currentIndex = 0;
    document.getElementById('procOffline').classList.toggle('active', proc === 'offline');
    document.getElementById('procSlow').classList.toggle('active', proc === 'slow');
    render();
  }

  function switchEquipo(eq) {
    equipoActual = eq;
    currentIndex = 0;
    document.getElementById('tabPhantom').classList.toggle('active', eq === 'phantom');
    document.getElementById('tabVilo').classList.toggle('active', eq === 'vilo');
    render();
  }

  function render() {
    const steps = data[procesoActual][equipoActual];
    const step = steps[currentIndex];
    
    // Chips superiores
    const row = document.getElementById('stepRow');
    row.innerHTML = '';
    steps.forEach((s, i) => {
      const chip = document.createElement('button');
      chip.className = 'step-chip' + (currentIndex === i ? ' active' : '');
      chip.textContent = s.title;
      chip.onclick = () => { currentIndex = i; render(); };
      row.appendChild(chip);
    });

    // Titulo y contenido
    document.getElementById('cardTitle').textContent = (procesoActual === 'offline' ? '❌ Router Offline' : '📉 Baja Velocidad');
    document.getElementById('contenido').innerHTML = `<div class="tag">${step.tag}</div>${step.html}`;
  }

  function nextStep() {
    const steps = data[procesoActual][equipoActual];
    if (currentIndex < steps.length - 1) {
      currentIndex++;
      render();
    }
  }

  function resetFlow() {
    currentIndex = 0;
    render();
  }

  render();
</script>
</body>
</html>
