<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupportOS Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; display: flex; height: 100vh; overflow: hidden; }
    
    /* SIDEBAR */
    .sidebar { width: 260px; background: #0f172a; color: white; display: flex; flex-direction: column; padding: 30px 20px; }
    .nav-btn { padding: 12px 15px; border-radius: 12px; margin-bottom: 5px; cursor: pointer; color: #94a3b8; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; transition: 0.3s; }
    .nav-btn.active { background: #3b82f6; color: white; }

    /* CONTENEDOR PRINCIPAL */
    .main { flex: 1; display: flex; flex-direction: column; background: white; border-radius: 30px 0 0 30px; box-shadow: -10px 0 30px rgba(0,0,0,0.05); }
    
    /* SELECTOR DE EQUIPO (TABS SUPERIORES) */
    .eq-selector { display: flex; gap: 10px; padding: 25px 40px; background: #f8fafc; border-radius: 30px 0 0 0; }
    .eq-btn { flex: 1; padding: 15px; border-radius: 15px; font-weight: 800; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .eq-btn.active { background: #0f172a; color: white; }
    .eq-btn.inactive { background: white; color: #0f172a; }

    /* BOTONES DE PASOS (TEXTO COMO TUS IMÁGENES) */
    .step-menu { display: flex; gap: 8px; padding: 0 40px 20px; flex-wrap: wrap; }
    .step-btn { padding: 8px 18px; border-radius: 12px; background: #e2e8f0; color: #475569; font-weight: 700; font-size: 13px; transition: 0.2s; }
    .step-btn.active { background: #00c896; color: white; }

    /* BLOQUE DE INFORMACIÓN */
    .content-card { margin: 0 40px; padding: 30px; border-radius: 20px; border: 1px solid #e2e8f0; background: white; flex: 1; overflow-y: auto; }
    .tag-final { background: #dcfce7; color: #166534; padding: 4px 12px; border-radius: 8px; font-weight: 800; font-size: 10px; text-transform: uppercase; margin-bottom: 10px; display: inline-block; }
    
    /* ESTILOS DE TUS PROCESOS */
    .alert-red { background: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; padding: 15px; border-radius: 15px; text-align: center; font-weight: 700; margin-bottom: 15px; }
    .box-validar { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 15px; padding: 20px; margin-top: 15px; }
    .box-validar h4 { color: #64748b; font-weight: 800; font-size: 12px; text-align: center; margin-bottom: 15px; text-transform: uppercase; }
    .box-validar ul { color: #475569; font-size: 14px; font-weight: 500; }
    .box-validar li { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .box-validar li::before { content: "•"; color: #3b82f6; font-weight: bold; }

    .btn-next { background: #0f172a; color: white; width: 100%; padding: 15px; border-radius: 15px; font-weight: 800; margin-top: 20px; }
</style>
</head>
<body>

<aside class="sidebar">
    <div class="flex items-center gap-3 mb-10">
        <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center shadow-lg"><i class="fas fa-network-wired text-white"></i></div>
        <span class="text-xl font-extrabold tracking-tight">Support<span class="text-blue-400">OS</span></span>
    </div>
    <div class="nav-btn active"><i class="fas fa-power-off"></i> Router Offline</div>
    <div class="nav-btn"><i class="fas fa-chart-line"></i> Bajas Velocidades</div>
</aside>

<main class="main">
    <div class="eq-selector">
        <button id="tabPhantom" class="eq-btn active" onclick="setEquipo('phantom')">Phantom</button>
        <button id="tabVilo" class="eq-btn inactive" onclick="setEquipo('vilo')">Router Vilo</button>
    </div>

    <div id="stepMenu" class="step-menu"></div>

    <div class="content-card">
        <div id="displayArea"></div>
        <button id="mainBtn" class="btn-next" onclick="nextStep()">Siguiente Paso</button>
    </div>
</main>

<script>
/* ==========================================
   BASE DE DATOS: EDITA AQUÍ TU INFORMACIÓN
   ========================================== */
const DATA = {
    phantom: [
        { 
            btn: "Validación", 
            tag: "INICIO", 
            title: "Router Offline", 
            content: `<p>Verifique que el servicio no esté suspendido o congelado.</p><div class="alert-red" style="background:#fff7ed; color:#9a3412; border-color:#ffedd5;">⚠️ Revisar falla masiva en la zona</div>` 
        },
        { 
            btn: "Principal", 
            tag: "SISTEMA", 
            title: "Router Principal", 
            content: `<p>Validar MAC en Radius y que tome IP.</p>` 
        },
        { 
            btn: "Secundario", 
            tag: "RED", 
            title: "Router Secundario", 
            content: `<p>Validar en Grafana y velocidad de puertos LAN.</p>` 
        },
        { 
            btn: "Usuario", 
            tag: "CLIENTE", 
            title: "Validación Física", 
            content: `<div class="alert-red">⚠️ No chuzar el equipo Phantom</div>` 
        },
        { 
            btn: "Resultado", 
            tag: "FINAL", 
            title: "Resultado", 
            content: `
                <div class="alert-red"><i class="fas fa-times"></i> No funciona</div>
                <div class="box-validar">
                    <h4>Antes de escalar validar:</h4>
                    <ul>
                        <li>Router principal validado</li>
                        <li>Router secundario validado</li>
                        <li>Conexiones correctas</li>
                        <li>Energía / luz del router OK</li>
                    </ul>
                </div>` 
        }
    ],
    vilo: [
        { btn: "Validación", tag: "INICIO", title: "Offline Vilo", content: "..." },
        { btn: "Principal", tag: "SISTEMA", title: "Configuración", content: "..." },
        { btn: "Físico", tag: "LED", title: "Estado de LED", content: "..." },
        { btn: "Resultado", tag: "FINAL", title: "Resultado", content: "..." }
    ]
};

/* ==========================================
   LÓGICA (NO NECESITAS TOCAR ESTO)
   ========================================== */
let equipoActual = 'phantom';
let pasoActual = 0;

function setEquipo(eq) {
    equipoActual = eq;
    pasoActual = 0;
    document.getElementById('tabPhantom').className = eq === 'phantom' ? 'eq-btn active' : 'eq-btn inactive';
    document.getElementById('tabVilo').className = eq === 'vilo' ? 'eq-btn active' : 'eq-btn inactive';
    render();
}

function render() {
    const pasos = DATA[equipoActual];
    const data = pasos[pasoActual];
    
    // Render botones de pasos
    const menu = document.getElementById('stepMenu');
    menu.innerHTML = pasos.map((p, i) => `
        <button class="step-btn ${i === pasoActual ? 'active' : ''}" onclick="goTo(${i})">${p.btn}</button>
    `).join('');

    // Render contenido
    document.getElementById('displayArea').innerHTML = `
        <span class="tag-final">${data.tag}</span>
        <h2 class="text-3xl font-extrabold text-slate-900 mb-6">${data.title}</h2>
        <div>${data.content}</div>
    `;

    document.getElementById('mainBtn').style.display = pasoActual === pasos.length - 1 ? 'none' : 'block';
}

function nextStep() { if(pasoActual < DATA[equipoActual].length - 1) { pasoActual++; render(); } }
function goTo(i) { pasoActual = i; render(); }

render();
</script>
</body>
</html>
