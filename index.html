<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soporte N1 - Hub</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:'Segoe UI',Tahoma,sans-serif;
    background:#d9d9d9;
    padding:14px;
    color:#111827;
  }

  .frame{
    max-width:520px;
    margin:auto;
    background:#f3f4f6;
    border:2px solid #3b82f6;
    padding:18px 16px 14px;
    border-radius: 8px;
  }

  .page-title{
    font-size:18px;
    font-weight:800;
    letter-spacing:.3px;
    margin:0 0 16px;
    color:#000;
    text-align: center;
  }

  .process-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }
  .btn-proc {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #fff;
    font-weight: 800;
    cursor: pointer;
    border: 2px solid #e5e7eb;
    font-size: 11px;
    text-transform: uppercase;
  }
  .btn-proc.active {
    background: #0f172a;
    color: white;
    border-color: #0f172a;
  }

  .panel{
    background:#ffffff;
    border-radius:12px;
    padding:14px;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
  }

  .top-tabs{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }

  .top-tab{
    flex:1;
    border:none;
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    background:#e5e7eb;
    color:#111;
    transition:.2s;
  }

  .top-tab.active{
    background:#3b82f6;
    color:#fff;
  }

  .step-row{
    display:flex;
    gap:6px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }

  .step-chip{
    flex:1;
    min-width: 80px;
    border:none;
    border-radius:8px;
    padding:8px 4px;
    font-size:10px;
    font-weight:700;
    cursor:pointer;
    background:#e5e7eb;
    color:#111;
    text-align: center;
  }

  .step-chip.active{
    background:#14c79a;
    color:#fff;
  }

  .card{
    background:#fff;
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:18px 16px 14px;
  }

  .card-title{
    font-size:16px;
    font-weight:800;
    color:#111827;
    margin:0 0 12px;
  }

  .tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:#4f46e5;
    background:#f5f3ff;
    padding:4px 8px;
    border-radius:999px;
    margin-bottom:12px;
  }

  .item{
    font-size:14px;
    line-height:1.45;
    margin-bottom:10px;
    color:#111827;
  }

  .nota-box{
    background:#FEF9C3;
    border-left:4px solid #FACC15;
    color:#854D0E;
    border-radius:8px;
    padding:10px 12px;
    font-size:13px;
    margin:8px 0 10px;
  }

  .alert-box {
    background: #FEF2F2;
    border-left: 4px solid #DC2626;
    color: #7F1D1D;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
  }

  .btn{
    width:100%;
    border:none;
    border-radius:10px;
    padding:12px 14px;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    margin-top:10px;
  }

  .btn-primary{ background:#14c79a; color:#fff; }
  .btn-secondary{ background:#fff; color:#444; border:1px solid #d1d5db; }
  .btn-danger{ background:#ef4444; color:#fff; }

</style>
</head>
<body>
  <div class="frame">
    <div class="page-title">SOPORTE TÉCNICO N1</div>

    <div class="process-selector">
      <button id="procOffline" class="btn-proc active" onclick="switchProceso('offline')">Router Offline</button>
      <button id="procSlow" class="btn-proc" onclick="switchProceso('slow')">Baja Velocidad</button>
    </div>

    <div class="panel">
      <div class="top-tabs">
        <button id="tabPhantom" class="top-tab active" onclick="switchEquipo('phantom')">Phantom</button>
        <button id="tabVilo" class="top-tab" onclick="switchEquipo('vilo')">Router Vilo</button>
      </div>

      <div id="stepRow" class="step-row"></div>

      <div class="card">
        <h3 id="cardTitle" class="card-title">Cargando...</h3>
        <div id="contenido"></div>
      </div>
    </div>
  </div>

<script>
  let procesoActual = 'offline';
  let equipoActual = 'phantom';
  let currentIndex = 0;

  const data = {
    offline: {
      phantom: [
        { title: 'Validación', tag: 'Sistema', html: `<div class="item">Verificar pago y estado en Radius.</div><div class="alert-box">🚫 Si está suspendido → Enviar link de pago.</div><div class="item">Revisar falla masiva.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Principal', tag: 'Radius', html: `<div class="item">Validar que tome IP. Si no toma IP → Escalar N2.</div><div class="nota-box">Revisar MAC en Radius.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Secundario', tag: 'Red', html: `<div class="item">Validar Grafana (No NA). Puerto LAN a 1G o 2G.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Usuario', tag: 'Cliente', html: `<div class="item">Reiniciar equipo (30 seg). Solicitar fotos conexiones.</div><div class="alert-box">⚠️ NO chuzar el Phantom.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Resultado', tag: 'Final', html: `<div class="item">¿El servicio funciona?</div><button class="btn btn-primary" onclick="resetFlow()">✅ Funciona</button><button class="btn btn-danger" onclick="nextStep()">❌ Escalar N2</button>` },
        { title: 'Escalar', tag: 'N2', html: `<div class="nota-box">✔ Validado Radius<br>✔ Validado Físico<br>✔ Validado Grafana</div><button class="btn btn-secondary" onclick="resetFlow()">Reiniciar</button>` }
      ],
      vilo: [
        { title: 'Validación', tag: 'Sistema', html: `<div class="item">Verificar pago y falla masiva.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Principal', tag: 'Radius', html: `<div class="item">Validar MAC y que tome IP.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Físico', tag: 'Estado Vilo', html: `<div class="nota-box"><b>NARANJA:</b> Configurar ISP Inventory. Si no sube, chuzar.</div><div class="alert-box" style="background:#FFF7ED; color:#9A3412; border-color:#F97316"><b>ROJO:</b> Validar cables y reiniciar físicamente.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Resultado', tag: 'Final', html: `<div class="item">¿El servicio funciona?</div><button class="btn btn-primary" onclick="resetFlow()">✅ Funciona</button><button class="btn btn-danger" onclick="nextStep()">❌ Escalar N2</button>` },
        { title: 'Escalar', tag: 'N2', html: `<div class="nota-box">✔ WAN Validada<br>✔ Color LED verificado</div><button class="btn btn-secondary" onclick="resetFlow()">Reiniciar</button>` }
      ]
    },
    slow: {
      phantom: [
        { title: 'Validación', tag: 'Sistema', html: `<div class="item">Validar que NO haya falla masiva.</div><div class="item">Confirmar plan contratado.</div><div class="nota-box">Asegurar que los routers NO tengan la misma IP.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Principal', tag: 'Hardware', html: `<div class="item">Revisar negociación de puerto en sistema (Debe ser 1000M).</div><div class="alert-box">Si negocia a 100M → Cambiar cable LAN del cliente.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'WiFi 5G', tag: 'Usuario', html: `<div class="item">Test en red 5G cerca del router principal (SOMOS Ookla).</div><div class="item">Validar en 2 o más dispositivos.</div><div class="item">Confirmar NO uso de VPN.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Canales', tag: 'Soporte', html: `<div class="item">Solicitar cambio de canales por Soporte.</div><div class="nota-box">Separar redes 2.4 y 5 si están unidas (SSID distinto).</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Cable', tag: 'Físico', html: `<div class="item">Realizar test por cable directo (Mínimo Cat 5e).</div><div class="item">Validar tarjeta de red del PC (Gigabit).</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Resultado', tag: 'Final', html: `<div class="item">¿Velocidad normalizada?</div><button class="btn btn-primary" onclick="resetFlow()">✅ Solucionado</button><button class="btn btn-danger" onclick="nextStep()">❌ Escalar N2</button>` },
        { title: 'Reporte', tag: 'N2', html: `<div class="nota-box">✔ Test cable adjunto<br>✔ Cambio canales solicitado<br>✔ Sin VPN</div><button class="btn btn-secondary" onclick="resetFlow()">Reiniciar</button>` }
      ],
      vilo: [
        { title: 'Validación', tag: 'Sistema', html: `<div class="item">Revisar falla masiva y plan contratado.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Mesh', tag: 'Cobertura', html: `<div class="item">Validar distancia entre nodos (Máx 2 paredes).</div><div class="nota-box">Verificar si hay nodos desconectados en App Inventory.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Optimización', tag: 'WiFi', html: `<div class="item">Cambio de canales y ancho de banda a 80MHz.</div><div class="item">Confirmar Firmware actualizado.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Pruebas', tag: 'Velocidad', html: `<div class="item">Test cerca del Vilo Principal con red 5G.</div><div class="item">Identificar equipos con alto consumo.</div><button class="btn btn-primary" onclick="nextStep()">Continuar</button>` },
        { title: 'Resultado', tag: 'Final', html: `<div class="item">¿Persiste lentitud?</div><button class="btn btn-primary" onclick="resetFlow()">✅ Solucionado</button><button class="btn btn-danger" onclick="nextStep()">❌ Escalar N2</button>` },
        { title: 'Escalar', tag: 'N2', html: `<div class="nota-box">✔ Nodos validados<br>✔ Canales optimizados</div><button class="btn btn-secondary" onclick="resetFlow()">Reiniciar</button>` }
      ]
    }
  };

  function switchProceso(proc) {
    procesoActual = proc;
    currentIndex = 0;
    document.getElementById('procOffline').classList.toggle('active', proc === 'offline');
    document.getElementById('procSlow').classList.toggle('active', proc === 'slow');
    render();
  }

  function switchEquipo(eq) {
    equipoActual = eq;
    currentIndex = 0;
    document.getElementById('tabPhantom').classList.toggle('active', eq === 'phantom');
    document.getElementById('tabVilo').classList.toggle('active', eq === 'vilo');
    render();
  }

  function render() {
    const steps = data[procesoActual][equipoActual];
    const step = steps[currentIndex];
    
    // Renderizado de botones superiores (chips)
    const row = document.getElementById('stepRow');
    row.innerHTML = '';
    steps.forEach((s, i) => {
      const chip = document.createElement('button');
      chip.className = 'step-chip' + (currentIndex === i ? ' active' : '');
      chip.textContent = s.title;
      chip.onclick = () => { currentIndex = i; render(); };
      row.appendChild(chip);
    });

    // Título dinámico
    const tituloTexto = (procesoActual === 'offline' ? '❌ Router Offline' : '📉 Baja Velocidad');
    document.getElementById('cardTitle').textContent = tituloTexto;
    
    // Contenido dinámico
    document.getElementById('contenido').innerHTML = `<div class="tag">${step.tag}</div>${step.html}`;
  }

  function nextStep() {
    const steps = data[procesoActual][equipoActual];
    if (currentIndex < steps.length - 1) {
      currentIndex++;
      render();
    }
  }

  function resetFlow() {
    currentIndex = 0;
    render();
  }

  // Inicialización
  render();
</script>
</body>
</html>
