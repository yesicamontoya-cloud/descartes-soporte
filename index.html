<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Hub N1 - Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }

        .app-container {
            max-width: 1000px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.1);
            display: flex;
            min-height: 650px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.7);
        }

        /* Sidebar Navegación */
        .sidebar {
            width: 280px;
            background: #0f172a;
            padding: 40px 24px;
            color: white;
        }

        .proc-item {
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
        }

        .proc-item:hover { background: rgba(255,255,255,0.05); color: #f1f5f9; }
        .proc-item.active { background: #3b82f6; color: white; box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4); }

        /* Contenido */
        .main-content { flex: 1; display: flex; flex-col; background: white; }

        /* Status Pills */
        .status-pill { padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .pill-sys { background: #e0f2fe; color: #0369a1; }
        
        /* Cajas de Información */
        .info-card { padding: 20px; border-radius: 20px; margin: 15px 0; border-left: 6px solid; transition: 0.3s; }
        .critical { background: #fef2f2; border-color: #ef4444; color: #991b1b; }
        .warning { background: #fffbeb; border-color: #f59e0b; color: #92400e; }
        .success { background: #f0fdf4; border-color: #22c55e; color: #166534; }
        .standard { background: #f8fafc; border-color: #3b82f6; color: #1e40af; }

        .btn-step {
            background: #0f172a;
            color: white;
            padding: 18px 30px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-step:hover { background: #1e293b; transform: translateY(-2px); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar flex flex-col justify-between">
            <div>
                <div class="flex items-center gap-3 mb-12 px-2">
                    <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-blue-400 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/30">
                        <i class="fas fa-network-wired text-white"></i>
                    </div>
                    <span class="text-xl font-extrabold tracking-tight">Support<span class="text-blue-400">OS</span></span>
                </div>

                <nav>
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-[2px] mb-4 px-2">Diagnóstico N1</p>
                    <div onclick="switchMainProc('offline')" id="proc-offline" class="proc-item active">
                        <i class="fas fa-link-slash"></i> Router Offline
                    </div>
                    <div onclick="switchMainProc('slow')" id="proc-slow" class="proc-item">
                        <i class="fas fa-chart-line"></i> Bajas Velocidades
                    </div>
                </nav>
            </div>

            <div class="bg-slate-800/50 p-4 rounded-2xl border border-white/5">
                <p class="text-[10px] text-slate-400 font-bold uppercase mb-2">Usuario N1</p>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center text-xs">JD</div>
                    <span class="text-xs font-semibold">Panel de Control</span>
                </div>
            </div>
        </aside>

        <main class="main-content flex flex-col">
            <header class="h-20 border-b border-slate-100 px-8 flex items-center justify-between">
                <div class="flex gap-8">
                    <button onclick="switchEquipo('phantom')" id="eq-phantom" class="text-sm font-extrabold pb-7 mt-7 border-b-2 border-blue-600 text-blue-600 transition-all">PHANTOM</button>
                    <button onclick="switchEquipo('vilo')" id="eq-vilo" class="text-sm font-extrabold pb-7 mt-7 border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-all">ROUTER VILO</button>
                </div>
                <div id="step-counter" class="text-[10px] font-black text-slate-400 bg-slate-100 px-3 py-1 rounded-full uppercase tracking-tighter">Paso 1 de 5</div>
            </header>

            <div class="flex-1 p-10 overflow-y-auto">
                <div id="content-viewer" class="max-w-xl">
                    </div>
            </div>

            <footer class="p-8 border-t border-slate-50 bg-slate-50/50 flex justify-between items-center">
                <button onclick="reset()" class="flex items-center gap-2 text-slate-400 hover:text-slate-600 font-bold text-xs uppercase tracking-widest transition-all">
                    <i class="fas fa-sync-alt"></i> Reiniciar Proceso
                </button>
                <button onclick="nextStep()" id="main-btn" class="btn-step shadow-xl shadow-slate-900/10">
                    Siguiente <i class="fas fa-chevron-right text-[10px]"></i>
                </button>
            </footer>
        </main>
    </div>

    <script>
        const database = {
            offline: {
                phantom: [
                    { title: "Verificación de Cuenta", tag: "Sistema", content: `
                        <p class="text-slate-500 mb-4">Verificar el estado del servicio en el CRM antes de cualquier validación física.</p>
                        <div class="info-card critical">
                            <b class="block mb-1 italic">Validación de Morosidad:</b>
                            Si el servicio está suspendido o congelado → <b>Informar al cliente y enviar link de pago.</b> No proceder con soporte técnico.
                        </div>
                        <div class="info-card warning">
                            <b class="block mb-1 italic">Falla Masiva:</b>
                            Revisar mapa de nodos. Si hay afectación en la zona → <b>Usar guion de falla masiva (Pág 4).</b>
                        </div>` 
                    },
                    { title: "Radius & IP", tag: "Radius", content: `
                        <p class="text-slate-500 mb-4">Validar la autenticación del equipo en la red.</p>
                        <div class="info-card standard font-semibold">
                            <ul class="space-y-3">
                                <li><i class="fas fa-check text-blue-500 mr-2"></i> Validar MAC asociada en Inventory.</li>
                                <li><i class="fas fa-check text-blue-500 mr-2"></i> Estado en Radius debe ser "Activo".</li>
                                <li><i class="fas fa-check text-blue-500 mr-2"></i> Verificar que el router esté tomando IP.</li>
                            </ul>
                        </div>
                        <div class="info-card critical text-sm">
                            <b>Escalamiento N2:</b> Si la MAC está activa en Radius pero el router NO toma IP → Escalar de inmediato.
                        </div>` 
                    },
                    { title: "Telemetría Grafana", tag: "Grafana", content: `
                        <p class="text-slate-500 mb-4">Revisión de puertos y conflictos de red.</p>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100">
                                <span class="text-[10px] font-black text-slate-400 uppercase">Puerto LAN</span>
                                <div class="text-lg font-extrabold text-slate-800">1G / 2G</div>
                            </div>
                            <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100">
                                <span class="text-[10px] font-black text-slate-400 uppercase">Estado</span>
                                <div class="text-lg font-extrabold text-blue-600 italic">No NA</div>
                            </div>
                        </div>
                        <div class="info-card warning mt-6 text-sm">
                            <b>Conflicto de IP:</b> Si ambos routers tienen la misma IP, el servicio se degradará. Validar y cambiar remotamente.
                        </div>` 
                    },
                    { title: "Validación en Sitio", tag: "Físico", content: `
                        <p class="text-slate-500 mb-4">Instrucciones críticas para el usuario final.</p>
                        <div class="info-card critical py-6 text-center shadow-lg shadow-red-100">
                            <i class="fas fa-hand-paper text-2xl mb-2"></i><br>
                            <b class="text-base uppercase tracking-wider">¡ATENCIÓN!</b><br>
                            PROHIBIDO chuzar (resetear) el equipo Phantom.
                        </div>
                        <ul class="mt-6 space-y-4 text-sm font-medium">
                            <li class="flex items-center gap-3"><span class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center text-[10px]">1</span> Reiniciar el router (30 segundos desconectado).</li>
                            <li class="flex items-center gap-3"><span class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center text-[10px]">2</span> Puerto WAN debe estar totalmente vacío.</li>
                            <li class="flex items-center gap-3"><span class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center text-[10px]">3</span> Solicitar fotos de las conexiones.</li>
                        </ul>` 
                    },
                    { title: "Cierre de Caso", tag: "Reporte", isFinal: true, content: `
                        <div class="bg-blue-600 text-white p-8 rounded-3xl shadow-xl shadow-blue-200">
                            <h3 class="text-xl font-black mb-2">Finalizar Soporte</h3>
                            <p class="text-blue-100 text-sm mb-6">¿El servicio se restableció correctamente tras las pruebas?</p>
                            <div class="flex gap-4">
                                <button class="flex-1 bg-white text-blue-600 py-3 rounded-xl font-black text-xs uppercase tracking-widest">Sí, Cerrar</button>
                                <button class="flex-1 bg-blue-500 text-white py-3 rounded-xl font-black text-xs uppercase tracking-widest">No, Escalar N2</button>
                            </div>
                        </div>` 
                    }
                ],
                vilo: [
                    { title: "Estado del LED", tag: "Hardware", content: `
                        <div class="info-card warning">
                            <b class="block text-lg mb-2 underline">LED NARANJA</b>
                            1. Configurar ISP Inventory.<br>
                            2. Si no sube: Chuzar el equipo.<br>
                            3. Re-configurar ISP Inventory.
                        </div>
                        <div class="info-card critical">
                            <b class="block text-lg mb-2 underline">LED ROJO</b>
                            1. Validar cables físicamente.<br>
                            2. Desconectar y conectar cable de red.<br>
                            3. Reiniciar físicamente.
                        </div>` 
                    },
                    { title: "Modo de Conexión", tag: "Red", content: `
                        <div class="info-card standard">
                            <b class="block mb-2">Validación WAN:</b>
                            - <b>Principal:</b> Debe tener el cable en el puerto WAN.<br>
                            - <b>Secundarios:</b> No deben tener cable en puerto WAN (Conexión Mesh).
                        </div>` 
                    }
                ]
            },
            slow: {
                phantom: [
                    { title: "Validación de Plan", tag: "Cuentas", content: `<div class="info-card standard">Validar plan contratado vs realidad en sistema. Revisar que no haya conflictos de IP entre routers.</div>` },
                    { title: "Negociación de Puerto", tag: "Grafana", content: `
                        <div class="grid grid-cols-2 gap-4">
                            <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-xl">
                                <b class="block text-emerald-700">1000 Mbps</b>
                                <span class="text-[10px] text-emerald-600 uppercase font-black">Puerto Correcto</span>
                            </div>
                            <div class="p-4 bg-rose-50 border border-rose-200 rounded-xl">
                                <b class="block text-rose-700">100 Mbps</b>
                                <span class="text-[10px] text-rose-600 uppercase font-black">Problema de Cable</span>
                            </div>
                        </div>` 
                    },
                    { title: "Test de Velocidad", tag: "Ookla", content: `
                        <ul class="space-y-4">
                            <li>• Test en red <b>5G</b> únicamente.</li>
                            <li>• Usar servidor <b>SOMOS (Ookla)</b>.</li>
                            <li>• Validar en 2 o más dispositivos.</li>
                            <li>• Confirmar que <b>NO</b> tenga VPN activa.</li>
                        </ul>` 
                    },
                    { title: "Canales & WiFi", tag: "Soporte", content: `
                        <div class="info-card warning">
                            <b>Acción Técnica:</b><br>
                            Solicitar cambio de canales por el grupo de Soporte. Separar redes 2.4 y 5 en caso de saturación.
                        </div>` 
                    }
                ],
                vilo: [
                    { title: "Señal Mesh", tag: "Inventory", content: `<div class="info-card warning">Validar que los nodos estén a máximo 2 paredes de distancia. Revisar estados en App Vilo.</div>` },
                    { title: "Ajuste de Banda", tag: "Config", content: `<div class="info-card standard">Configurar ancho de banda a <b>80MHz</b> en la banda 5G y validar versión de firmware.</div>` }
                ]
            }
        };

        let currentMainProc = 'offline';
        let currentEq = 'phantom';
        let currentIdx = 0;

        function switchMainProc(proc) {
            currentMainProc = proc;
            currentIdx = 0;
            document.querySelectorAll('.proc-item').forEach(b => b.classList.remove('active'));
            document.getElementById(`proc-${proc}`).classList.add('active');
            render();
        }

        function switchEquipo(eq) {
            currentEq = eq;
            currentIdx = 0;
            document.getElementById('eq-phantom').className = eq === 'phantom' ? 'text-sm font-extrabold pb-7 mt-7 border-b-2 border-blue-600 text-blue-600 transition-all' : 'text-sm font-extrabold pb-7 mt-7 border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-all';
            document.getElementById('eq-vilo').className = eq === 'vilo' ? 'text-sm font-extrabold pb-7 mt-7 border-b-2 border-blue-600 text-blue-600 transition-all' : 'text-sm font-extrabold pb-7 mt-7 border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-all';
            render();
        }

        function render() {
            const steps = database[currentMainProc][currentEq];
            const step = steps[currentIdx];
            
            document.getElementById('step-counter').textContent = `Paso ${currentIdx + 1} de ${steps.length}`;

            document.getElementById('content-viewer').innerHTML = `
                <div class="animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <span class="status-pill pill-sys mb-4 inline-block">${step.tag}</span>
                    <h2 class="text-4xl font-extrabold text-slate-900 mb-8 tracking-tighter">${step.title}</h2>
                    <div class="text-slate-600 leading-relaxed">${step.content}</div>
                </div>
            `;

            const btn = document.getElementById('main-btn');
            btn.innerHTML = currentIdx === steps.length - 1 ? 'Finalizar Proceso' : 'Siguiente Paso <i class="fas fa-chevron-right text-[10px] ml-2"></i>';
        }

        function nextStep() {
            const steps = database[currentMainProc][currentEq];
            if (currentIdx < steps.length - 1) {
                currentIdx++;
                render();
            } else {
                alert("Proceso finalizado con éxito.");
            }
        }

        function reset() { currentIdx = 0; render(); }

        render();
    </script>
</body>
</html>
