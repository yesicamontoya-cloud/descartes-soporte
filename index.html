let procesoActual = 'offline';
let equipoActual = 'phantom';
let pasoActual = 0;
function toggleMenu(groupId, headerElement) {
    const group = document.getElementById(groupId);
    const arrow = headerElement.querySelector('.arrow-icon');
    
    group.classList.toggle('open');
    arrow.classList.toggle('rotate');
}
function cambiarProceso(proc) {
    procesoActual = proc; pasoActual = 0;
    document.getElementById('navOffline').classList.toggle('active', proc === 'offline');
    document.getElementById('navBajas').classList.toggle('active', proc === 'bajas');
    document.getElementById('navN2').classList.toggle('active', proc === 'n2');
    const navBajasN2 = document.getElementById('navBajasN2');
    if(navBajasN2) navBajasN2.classList.toggle('active', proc === 'bajasN2');
    render(); 
}

function setEquipo(eq) {
    equipoActual = eq; pasoActual = 0;
    document.getElementById('btnPhantom').classList.toggle('active', eq === 'phantom');
    document.getElementById('btnVilo').classList.toggle('active', eq === 'vilo');
    render();
}

function render() {
    const pasos = DATA[procesoActual][equipoActual];
    const data = pasos[pasoActual];
    let pillsHtml = '';
    
    pasos.forEach((p, index) => {
        pillsHtml += `<button class="${index === pasoActual ? 'active' : ''}" onclick="irAPaso(${index})">${p.pill}</button>`;
    });

    document.getElementById('pillsContainer').innerHTML = pillsHtml;

    // Esta variable detecta si estamos en N2 para cambiar los colores
    const isN2 = procesoActual.includes('n2') || procesoActual === 'bajasN2';

    document.getElementById("app").innerHTML = `
        <div class="animate-in">
            <div class="tag ${isN2 ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}">
                ${isN2 ? 'ESPECIALIZADO N2' : 'DIAGNÓSTICO N1'} - ${data.tag}
            </div>
            
            <h3 class="text-2xl font-bold mb-4">${data.title}</h3>
            <div class="block mb-6">${data.html}</div>

            <div class="flex flex-col gap-3">
                ${pasoActual < pasos.length - 1 ? 
                    `<button class="btn" style="background: ${isN2 ? '#f97316' : '#0f172a'}" onclick="siguiente()">
                        Continuar Paso <i class="fas fa-arrow-right ml-2"></i>
                    </button>` : ''}
                
                <button class="btn-reset" onclick="reset()">
                    <i class="fas fa-redo-alt mr-2"></i> Reiniciar Proceso
                </button>
            </div>
        </div>`;
}

function irAPaso(i) { 
        pasoActual = i; 
        render(); 
    }

    function siguiente() { 
        pasoActual++; 
        render(); 
    }

    function reset() { 
        pasoActual = 0; 
        render(); 
    }

    window.onload = render;
</script>
