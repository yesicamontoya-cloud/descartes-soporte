<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support OS - Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }

        /* Contenedor tipo Aplicación */
        .app-shell {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        /* Sidebar de Procesos */
        .sidebar {
            background: #0f172a;
            color: #f1f5f9;
            width: 260px;
            padding: 30px 20px;
        }

        .proc-card {
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }

        .proc-card:hover { background: rgba(255,255,255,0.05); color: white; }
        .proc-card.active { background: #3b82f6; color: white; box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3); }

        /* Tabs de Equipos */
        .eq-tab {
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }
        .eq-tab.active { color: #3b82f6; border-bottom: 2px solid #3b82f6; }

        /* Burbujas de Pasos */
        .step-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #e2e8f0;
            transition: 0.4s;
        }
        .step-dot.active { background: #3b82f6; transform: scale(1.5); }

        /* Cajas de Alerta con Estilo */
        .box-info { padding: 16px; border-radius: 16px; font-size: 14px; line-height: 1.6; margin: 12px 0; border-left: 4px solid; }
        .danger { background: #fff1f2; border-color: #fb7185; color: #9f1239; }
        .warning { background: #fffbeb; border-color: #fbbf24; color: #92400e; }
        .info { background: #eff6ff; border-color: #60a5fa; color: #1e40af; }

        .btn-next {
            background: #0f172a;
            color: white;
            padding: 16px 32px;
            border-radius: 14px;
            font-weight: 700;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-next:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="app-shell flex flex-col md:flex-row">
        
        <aside class="sidebar flex flex-col justify-between">
            <div>
                <div class="flex items-center gap-3 mb-10 px-2">
                    <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center">
                        <i class="fas fa-bolt text-white text-sm"></i>
                    </div>
                    <span class="font-extrabold tracking-tight text-xl">Support<span class="text-blue-400">Hub</span></span>
                </div>

                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-[2px] mb-4 px-2">Procesos N1</p>
                
                <div onclick="switchMainProc('offline')" id="proc-offline" class="proc-card active">
                    <i class="fas fa-power-off"></i> Router Offline
                </div>
                <div onclick="switchMainProc('slow')" id="proc-slow" class="proc-card">
                    <i class="fas fa-gauge-high"></i> Bajas Velocidades
                </div>

                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-[2px] mt-8 mb-4 px-2">Especializados N2</p>
                <div class="proc-card opacity-40 cursor-not-allowed">
                    <i class="fas fa-microchip"></i> Config. Avanzada
                </div>
            </div>

            <div class="px-2">
                <div class="bg-slate-800 rounded-xl p-4 text-[11px] text-slate-400 border border-slate-700">
                    <i class="fas fa-info-circle mr-1"></i> Versión 2.0.4 - 2026
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-white">
            
            <header class="p-6 border-b border-slate-100 flex justify-between items-center">
                <div class="flex gap-4">
                    <button onclick="switchEquipo('phantom')" id="eq-phantom" class="eq-tab active">Phantom</button>
                    <button onclick="switchEquipo('vilo')" id="eq-vilo" class="eq-tab">Router Vilo</button>
                </div>
                <div class="flex gap-2" id="dots-container">
                    </div>
            </header>

            <div class="flex-1 p-10 overflow-y-auto" style="max-height: 500px;">
                <div id="content-viewer" class="animate-in fade-in duration-500">
                    </div>
            </div>

            <footer class="p-6 border-t border-slate-100 bg-slate-50 flex justify-between items-center">
                <button onclick="reset()" class="text-slate-400 hover:text-slate-600 font-bold text-xs uppercase tracking-widest">
                    <i class="fas fa-redo-alt mr-2"></i> Reiniciar
                </button>
                <button onclick="nextStep()" id="main-btn" class="btn-next">
                    Siguiente paso <i class="fas fa-arrow-right text-xs"></i>
                </button>
            </footer>
        </main>
    </div>

    <script>
        const database = {
            offline: {
                phantom: [
                    { title: "Verificación de Estado", tag: "Sistema", content: `<p class="mb-4">Confirme en el CRM si la cuenta presenta morosidad o si existe un bloqueo administrativo.</p><div class="box-info danger"><b>Pago Pendiente:</b> Si el servicio está suspendido, suspenda el diagnóstico y envíe link de pasarela de pagos.</div><div class="box-info warning"><b>Falla Masiva:</b> Valide el mapa de nodos. Si la zona está afectada, informe tiempo estimado de solución.</div>` },
                    { title: "Análisis de Radius", tag: "Herramienta", content: `<p>Acceda a Radius y verifique el estado de la MAC.</p><ul class="mt-4 space-y-3 font-medium text-slate-600"><li><i class="fas fa-check-circle text-blue-500 mr-2"></i> Validar asociación en Inventory.</li><li><i class="fas fa-check-circle text-blue-500 mr-2"></i> Estado debe ser <b>Activo</b>.</li><li><i class="fas fa-check-circle text-blue-500 mr-2"></i> Verifique que esté asignando IP.</li></ul><div class="box-info info italic">Si Radius reporta "Offline" pero el equipo está encendido, es posible un daño físico en el puerto.</div>` },
                    { title: "Inspección Grafana", tag: "Red", content: `<p>Valide la telemetría del router en tiempo real.</p><div class="grid grid-cols-2 gap-4 mt-6"><div class="p-4 border border-slate-100 rounded-xl"><span class="block text-[10px] text-slate-400 uppercase font-bold">Estado</span><span class="font-bold">No NA</span></div><div class="p-4 border border-slate-100 rounded-xl"><span class="block text-[10px] text-slate-400 uppercase font-bold">Vel. Puerto</span><span class="font-bold">1G / 2G</span></div></div><p class="mt-6 text-sm text-slate-500 italic">Si las IPs de ambos routers coinciden, genere cambio de IP de forma remota.</p>` },
                    { title: "Soporte Físico", tag: "Cliente", content: `<p class="mb-4">Guíe al cliente para las validaciones en sitio.</p><div class="box-info danger"><b>IMPORTANTE:</b> Está estrictamente prohibido pulsar el botón Reset (chuzar) del equipo Phantom.</div><ul class="space-y-2 text-sm mt-4"><li>• Solicitar reinicio eléctrico (30 segundos).</li><li>• Verificar que el puerto WAN esté vacío.</li><li>• Confirmar color y parpadeo de LEDs.</li></ul>` },
                    { title: "Resolución", tag: "Cierre", isFinal: true, content: `<div class="text-center py-10"><div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6"><i class="fas fa-clipboard-check text-2xl"></i></div><h3 class="text-xl font-bold">Diagnóstico Finalizado</h3><p class="text-slate-500 text-sm mt-2">¿Pudo resolver el inconveniente o requiere escalamiento?</p></div>` }
                ],
                vilo: [
                    { title: "Pre-Validación", tag: "Cuentas", content: `<div class="box-info danger">Validar estado de cuenta y cortes en la zona.</div>` },
                    { title: "Estados de LED", tag: "Hardware", content: `<div class="box-info warning"><b>Naranja:</b> Configurar ISP desde la App Inventory. Si persiste chuzar equipo.</div><div class="box-info danger"><b>Rojo:</b> Falla de enlace WAN. Verificar cables y reiniciar.</div>` },
                    { title: "Conexión WAN", tag: "Físico", content: `<p>Verifique que el equipo principal tenga el cable en puerto WAN y los secundarios estén conectados vía Mesh (inalámbricos) o cable LAN.</p>` },
                    { title: "Resolución", tag: "Final", isFinal: true, content: `<div class="item text-center font-bold">Proceso Vilo completado.</div>` }
                ]
            },
            slow: {
                phantom: [
                    { title: "Validación Base", tag: "Plan", content: `<p>Confirme que el plan contratado coincida con la expectativa del cliente.</p><div class="box-info warning">Verifique que no haya IPs duplicadas en la red interna del usuario.</div>` },
                    { title: "Negociación LAN", tag: "Hardware", content: `<p>Valide en Grafana la velocidad del puerto LAN conectado.</p><div class="mt-6 space-y-4"><div class="flex items-center justify-between p-4 bg-emerald-50 rounded-xl"><span class="text-sm font-bold text-emerald-700">1000 Mbps</span><span class="text-xs text-emerald-600">Puerto Óptimo</span></div><div class="flex items-center justify-between p-4 bg-rose-50 rounded-xl"><span class="text-sm font-bold text-rose-700">100 Mbps</span><span class="text-xs text-rose-600">Cambiar Cable LAN</span></div></div>` },
                    { title: "Test 5G", tag: "Ookla", content: `<p>Solicite un test de velocidad usando exclusivamente la red 5G.</p><ul class="mt-4 space-y-2 text-sm italic text-slate-500"><li>- Servidor sugerido: SOMOS.</li><li>- Distancia: Máximo 2 metros del equipo.</li><li>- Sin VPN activa.</li></ul>` },
                    { title: "Cierre", tag: "Resolución", isFinal: true, content: `<div class="box-info info">Si por cable funciona OK y por WiFi no, es interferencia de canales. Solicite cambio de canales a Soporte.</div>` }
                ],
                vilo: [
                    { title: "Validación Mesh", tag: "App", content: `<p>Revise en Inventory la señal entre nodos.</p><div class="box-info warning">Los nodos deben estar a máximo 2 paredes de distancia.</div>` },
                    { title: "Canales", tag: "Config", content: `<p>Ajuste el ancho de banda a 80MHz para mejorar el rendimiento de la banda 5G.</p>` },
                    { title: "Resolución", tag: "Cierre", isFinal: true, content: `<p class="text-center font-bold">Proceso de velocidad Vilo terminado.</p>` }
                ]
            }
        };

        let currentMainProc = 'offline';
        let currentEq = 'phantom';
        let currentIdx = 0;

        function switchMainProc(proc) {
            currentMainProc = proc;
            currentIdx = 0;
            document.querySelectorAll('.proc-card').forEach(b => b.classList.remove('active'));
            document.getElementById(`proc-${proc}`).classList.add('active');
            render();
        }

        function switchEquipo(eq) {
            currentEq = eq;
            currentIdx = 0;
            document.getElementById('eq-phantom').classList.toggle('active', eq === 'phantom');
            document.getElementById('eq-vilo').classList.toggle('active', eq === 'vilo');
            render();
        }

        function render() {
            const steps = database[currentMainProc][currentEq];
            const step = steps[currentIdx];
            
            // Dots de progreso
            const dots = document.getElementById('dots-container');
            dots.innerHTML = steps.map((_, i) => `<div class="step-dot ${i === currentIdx ? 'active' : ''}"></div>`).join('');

            // Contenido
            document.getElementById('content-viewer').innerHTML = `
                <span class="text-[10px] font-black bg-blue-100 text-blue-600 px-3 py-1 rounded-full tracking-widest uppercase mb-4 inline-block">${step.tag}</span>
                <h2 class="text-3xl font-extrabold text-slate-900 mb-6 leading-tight">${step.title}</h2>
                <div class="text-slate-600">${step.content}</div>
            `;

            // Botón
            const btn = document.getElementById('main-btn');
            btn.innerHTML = currentIdx === steps.length - 1 ? 'Finalizar Reporte' : 'Siguiente Paso <i class="fas fa-arrow-right text-xs ml-2"></i>';
        }

        function nextStep() {
            const steps = database[currentMainProc][currentEq];
            if (currentIdx < steps.length - 1) {
                currentIdx++;
                render();
            } else {
                alert("Reporte guardado");
            }
        }

        function reset() { currentIdx = 0; render(); }

        render();
    </script>
</body>
</html>
