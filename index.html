<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupportOS - N1 Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; height: 100vh; overflow: hidden; display: flex; }

    /* SIDEBAR AZUL OSCURO */
    .sidebar { width: 280px; background: #0f172a; color: white; display: flex; flex-direction: column; padding: 40px 24px; }
    .nav-item { padding: 14px 18px; border-radius: 14px; margin-bottom: 8px; cursor: pointer; color: #94a3b8; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; }
    .nav-item.active { background: #3b82f6; color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

    /* CONTENIDO */
    .main-content { flex: 1; display: flex; flex-direction: column; background: white; border-radius: 32px 0 0 32px; box-shadow: -10px 0 50px rgba(0,0,0,0.05); }
    .selector { display: flex; gap: 40px; border-bottom: 1px solid #f1f5f9; padding: 0 40px; }
    .selector button { padding: 20px 0; font-weight: 800; font-size: 13px; color: #94a3b8; border-bottom: 3px solid transparent; text-transform: uppercase; }
    .selector button.active { color: #3b82f6; border-bottom-color: #3b82f6; }

    /* PASOS CON TEXTO */
    .menu { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .menu button { padding: 8px 16px; border-radius: 12px; background: #f1f5f9; font-size: 12px; font-weight: 700; color: #64748b; transition: 0.2s; }
    .menu button.active { background: #00c896; color: white; }

    /* BLOQUE DE INFO */
    .block { background: #fff; border-radius: 24px; padding: 32px; border: 1px solid #e2e8f0; }
    h3 { font-size: 24px; font-weight: 800; margin-bottom: 15px; color: #0f172a; }
    .item { font-size: 14px; margin-bottom: 10px; color: #475569; line-height: 1.5; }
    .tag { display: inline-block; font-size: 10px; font-weight: 800; background: #eef3ff; color: #3b5bcc; padding: 4px 12px; border-radius: 99px; text-transform: uppercase; margin-bottom: 10px; }
    
    /* ALERTAS ORIGINALES */
    .alert-pago { background: #fef2f2; border-left: 4px solid #ef4444; color: #991b1b; padding: 12px; border-radius: 10px; font-weight: 700; margin: 10px 0; }
    .alert-falla { background: #fff7ed; border-left: 4px solid #f97316; color: #9a3412; padding: 12px; border-radius: 10px; font-weight: 700; margin: 10px 0; }
    .nota-box { background: #fef9c3; border-left: 4px solid #facc15; padding: 12px; border-radius: 10px; font-size: 12px; color: #854d0e; margin-bottom: 10px; }
    .action { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 12px; border-radius: 10px; margin: 10px 0; font-size: 13px; font-weight: 600; color: #1e40af; }

    /* DISEÑO DE RESULTADOS INTEGRADOS */
    .res-container { border-radius: 20px; padding: 24px; margin-bottom: 16px; border-left: 6px solid transparent; }
    .res-ok { background: #f0fdf4; border-left-color: #10b981; }
    .res-ok .title { color: #065f46; font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .res-ok .desc { color: #065f46; font-size: 14px; margin-top: 4px; font-weight: 500; }

    .res-bad { background: #fef2f2; border-left-color: #ef4444; }
    .res-bad .title { color: #991b1b; font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .res-bad .desc { color: #991b1b; font-size: 14px; margin-top: 4px; margin-bottom: 16px; }
    .checklist-box { background: #fffafa; border-radius: 14px; padding: 16px; border: 1px solid #fee2e2; }
    .checklist-box b { color: #7f1d1d; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 8px; }
    .checklist-box ul { list-style: none; padding: 0; margin: 0; }
    .checklist-box li { color: #991b1b; font-size: 13px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .checklist-box li::before { content: "•"; color: #ef4444; font-weight: 800; }

    /* BOTONES */
    .btn-main { margin-top: 20px; width: 100%; padding: 16px; border-radius: 16px; background: #0f172a; color: white; font-weight: 800; transition: 0.3s; }
    .btn-reset { color: #94a3b8; font-size: 11px; font-weight: 800; margin-top: 20px; cursor: pointer; text-align: center; width: 100%; text-transform: uppercase; }
    .ref-img { margin-top: 15px; border-radius: 15px; overflow: hidden; border: 1px solid #e2e8f0; }
</style>
</head>

<body>
<aside class="sidebar">
    <div class="flex items-center gap-3 mb-12">
        <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center shadow-lg"><i class="fas fa-network-wired text-white"></i></div>
        <span class="text-xl font-extrabold">Support<span class="text-blue-400">OS</span></span>
    </div>
    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Diagnóstico N1</p>
    <div class="nav-item active"><i class="fas fa-power-off"></i> Router Offline</div>
    <div class="nav-item"><i class="fas fa-chart-line"></i> Bajas Velocidades</div>
</aside>

<main class="main-content">
    <div class="selector">
        <button id="tabPhantom" class="active" onclick="loadPhantom()">Phantom</button>
        <button id="tabVilo" onclick="loadVilo()">Router Vilo</button>
    </div>
    <div class="flex-1 p-10 overflow-y-auto">
        <div id="contenido" class="max-w-2xl mx-auto"></div>
    </div>
</main>

<script>
const openLink = (url) => window.open(url, "_blank");

/* INFO PHANTOM RESTAURADA */
const PHANTOM_DATA = [
    { btn: "Validación", tag: "Sistema", title: "🔍 Router Offline", html: `
        <div class="item">Verifique que el servicio no esté suspendido por falta de pago o congelado</div>
        <div class="alert-pago">🚫 Si está suspendido → enviar link de pago</div>
        <div class="item">Revise si existe una falla masiva en la zona</div>
        <div class="alert-falla">⚠️ Si hay falla → usar guion</div>
        <button class="btn-main" style="background:#3b82f6" onclick="openLink('https://docs.google.com/presentation/d/1JMXrbALMvQ3tWBmwlh9zd4iF1o-o-m3ZlvtuyhR0UbM/edit?usp=sharing')">Abrir guion falla masiva (Pág. 4)</button>` 
    },
    { btn: "Principal", tag: "Herramienta", title: "🖥 Router principal", html: `
        <div class="item">Validar que la MAC esté asociada y autenticada en Radius (estado activo)</div>
        <div class="action">Si no está activo → escalar backoffice</div>
        <div class="item">Verificar que el router tome IP</div>
        <div class="action">Si no toma IP → escalar a N2</div>
        <div class="ref-img"><img src="https://i.imgur.com/f0ERrPo.png"></div>`
    },
    { btn: "Secundario", tag: "Red", title: "🔀 Router secundario", html: `
        <div class="item">Confirmar que no tenga la misma IP que el principal</div>
        <div class="item">Validar en Grafana que no esté en NA</div>
        <div class="nota-box">Nota: No aplica para domótica: la velocidad de los puertos no es relevante</div>
        <div class="action">Si hay inconsistencia y el router secundario está OFF → escalar a N2</div>`
    },
    { btn: "Usuario", tag: "Cliente", title: "🔌 Validación física", html: `
        <div class="item">Revisar conexiones físicas y energía. Confirmar que no haya cables en el puerto WAN.</div>
        <div class="item">Reiniciar el equipo (30 segundos desconectado)</div>
        <div class="alert-falla" style="border-color:#f87171; color:#b91c1c">❌ No chuzar el equipo</div>`
    },
    { btn: "Resultado", tag: "Final", title: "✅ Resultado", html: `
        <div class="res-container res-ok">
            <div class="title"><i class="fas fa-check-circle"></i> Funciona</div>
            <div class="desc">Dar por finalizado el chat.</div>
        </div>
        <div class="res-container res-bad">
            <div class="title"><i class="fas fa-times-circle"></i> No funciona</div>
            <div class="desc">Escalar a N2.</div>
            <div class="checklist-box">
                <b>Antes de escalar validar:</b>
                <ul>
                    <li>Router principal validado</li>
                    <li>Router secundario validado</li>
                    <li>Conexiones correctas</li>
                    <li>Energía OK</li>
                </ul>
            </div>
        </div>`
    }
];

/* INFO VILO RESTAURADA */
const VILO_DATA = [
    { btn: "Validación", tag: "Sistema", title: "🔍 Validación Vilo", html: `<div class="alert-pago">🚫 Verificar morosidad o falla masiva.</div>` },
    { btn: "Físico", tag: "Estado LED", title: "🔌 Validación física", html: `
        <div class="nota-box"><b>Naranja:</b> Configurar router en Inventory. Si no sube: Chuzar.</div>
        <div class="nota-box"><b>Rojo:</b> Validar cables físicos y reiniciar.</div>
        <div class="action">Blanco: WiFi 6 OK | Azul: WiFi 5 OK</div>` 
    },
    { btn: "Resultado", tag: "Final", title: "✅ Resultado", html: `
        <div class="res-container res-bad">
            <div class="title"><i class="fas fa-times-circle"></i> No funciona</div>
            <div class="desc">Escalar a N2.</div>
        </div>`
    }
];

let currentIdx = 0;
let currentMode = 'phantom';

function loadPhantom() { 
    currentMode = 'phantom'; currentIdx = 0; 
    document.getElementById('tabPhantom').className = 'active';
    document.getElementById('tabVilo').className = '';
    render(); 
}

function loadVilo() { 
    currentMode = 'vilo'; currentIdx = 0; 
    document.getElementById('tabVilo').className = 'active';
    document.getElementById('tabPhantom').className = '';
    render(); 
}

function render() {
    const data = currentMode === 'phantom' ? PHANTOM_DATA : VILO_DATA;
    const step = data[currentIdx];
    
    document.getElementById('contenido').innerHTML = `
        <div class="menu">
            ${data.map((s, i) => `<button class="${i === currentIdx ? 'active' : ''}" onclick="currentIdx=${i}; render()">${s.btn}</button>`).join('')}
        </div>
        <div class="block">
            <span class="tag">${step.tag}</span>
            <h3>${step.title}</h3>
            ${step.html}
            ${currentIdx < data.length - 1 ? `<button class="btn-main" onclick="currentIdx++; render()">Siguiente Paso</button>` : ''}
            <div class="btn-reset" onclick="load${currentMode.charAt(0).toUpperCase() + currentMode.slice(1)}()">Reiniciar Proceso</div>
        </div>`;
}

loadPhantom();
</script>
</body>
</html>
